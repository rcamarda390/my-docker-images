name: Build and publish Bifrost MCP image

on:
  workflow_dispatch:

# Serialize publications so two dispatches cannot calculate the same next tag.
concurrency:
  group: bifrost-mcp-publish
  cancel-in-progress: false

permissions:
  # Required by the reusable workflow contract. Published-tag revision mode
  # does not exercise the revision-PR step, but a caller cannot grant less than
  # permissions declared by the called workflow.
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    name: Build and publish Bifrost MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: bifrost-mcp
      context: ./images/bifrost-mcp
      dockerfile: ./images/bifrost-mcp/Dockerfile
      config: images/bifrost-mcp/image.yaml
      version_arg: BIFROST_VERSION
      # The Dockerfile clones this exact upstream commit and verifies the tag.
      platforms: linux/amd64
      run_smoke_test: false
      smoke_healthcheck: true
      scan: true
      # Count tags already published for this upstream version. Failed builds
      # publish no tag, so they do not consume a revision.
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}
