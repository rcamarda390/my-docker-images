name: Build and publish Gnosis mdbr-leaf-ir model data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - images/gnosis-model-mdbr-leaf-ir/**
      - .github/workflows/build-gnosis-model-mdbr-leaf-ir.yml
  push:
    branches: [main]
    paths:
      - images/gnosis-model-mdbr-leaf-ir/**
      - .github/workflows/build-gnosis-model-mdbr-leaf-ir.yml

concurrency:
  group: gnosis-model-mdbr-leaf-ir-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image_name: gnosis-model-mdbr-leaf-ir
      context: ./images/gnosis-model-mdbr-leaf-ir
      dockerfile: ./images/gnosis-model-mdbr-leaf-ir/Dockerfile
      config: images/gnosis-model-mdbr-leaf-ir/image.yaml
      version_arg: MODEL_VERSION
      revision_arg: MODEL_REVISION
      platforms: linux/amd64
      run_smoke_test: true
      host_smoke_command: python3 images/gnosis-model-mdbr-leaf-ir/verify.py
      scan: true
      publish_ghcr: false
      publish_dockerhub: true
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}

  verify-published:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pull published tag, then verify extraction by immutable digest
        env:
          IMAGE: ${{ needs.build.outputs.dockerhub_image }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          python3 images/gnosis-model-mdbr-leaf-ir/verify.py "$digest" | tee verification.txt
          {
            echo '### Published model verified'
            echo "Image: $IMAGE"
            echo "Digest: $digest"
            echo 'Base: scratch. Data only; no ENTRYPOINT or CMD.'
            echo 'Xray clearance must be confirmed in Artifactory.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: gnosis-model-verification
          path: verification.txt
