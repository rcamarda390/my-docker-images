name: Build and publish sooperset-mcp-atlassian image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - images/sooperset-mcp-atlassian/**
      - .github/workflows/build-sooperset-mcp-atlassian.yml
  push:
    branches:
      - main
    paths:
      - images/sooperset-mcp-atlassian/**
      - .github/workflows/build-sooperset-mcp-atlassian.yml

concurrency:
  group: sooperset-mcp-atlassian-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    name: Build and publish sooperset-mcp-atlassian image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: sooperset-mcp-atlassian
      context: ./images/sooperset-mcp-atlassian
      dockerfile: ./images/sooperset-mcp-atlassian/Dockerfile
      config: images/sooperset-mcp-atlassian/image.yaml
      version_arg: VERSION
      platforms: linux/amd64
      smoke_command: --help
      scan: true
      block_on_scan_failure: true
      # Choose the next revision from successfully published Docker Hub tags.
      # Failed builds consume no revision and existing tags are never reused.
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}
