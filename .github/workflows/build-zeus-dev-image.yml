name: Build and publish zeus-dev-image

on:
  workflow_dispatch:

# Serialize publications so concurrent dispatches cannot select the same next tag.
concurrency:
  group: zeus-dev-image-publish
  cancel-in-progress: false

permissions:
  # Required by the reusable workflow contract. Published-tag revision mode
  # does not use the revision-PR step, but callers cannot grant less than the
  # permissions declared by the called workflow.
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    name: Build and publish zeus-dev-image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: zeus-dev-image
      context: ./images/zeus-dev-image
      dockerfile: ./images/zeus-dev-image/Dockerfile
      config: images/zeus-dev-image/image.yaml
      version_arg: ZEUS_DEV_IMAGE_VERSION
      platforms: linux/amd64
      timeout_minutes: 45
      # This composite base image verifies its installed software directly.
      # It is not a network service, so Bifrost's HTTP health check does not apply.
      smoke_command: /usr/local/bin/verify-installation.sh
      scan: true
      # Choose the next revision from successfully published Docker Hub tags.
      # Failed builds consume no revision and no revision-bump PR is needed.
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}
