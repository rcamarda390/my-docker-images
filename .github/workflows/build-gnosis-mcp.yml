name: Build and publish Gnosis MCP image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "images/gnosis-mcp/**"
      - ".github/workflows/build-gnosis-mcp.yml"
      - ".github/workflows/build-image.yml"
  push:
    branches: [main]
    paths: ['images/gnosis-mcp/**']

# Serialize publications so two dispatches cannot calculate the same next tag.
concurrency:
  group: gnosis-mcp-publish
  cancel-in-progress: false

permissions:
  # Required by the reusable workflow contract. Published-tag revision mode
  # does not exercise the revision-PR step, but a caller cannot grant less than
  # permissions declared by the called workflow.
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: gnosis-mcp
      context: ./images/gnosis-mcp
      dockerfile: ./images/gnosis-mcp/Dockerfile
      config: images/gnosis-mcp/image.yaml
      version_arg: GNOSIS_VERSION
      revision_arg: GNOSIS_IMAGE_VERSION
      platforms: linux/amd64
      smoke_env: -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1
      smoke_entrypoint: /bin/sh
      smoke_command: -c,gnosis-mcp init-db && gnosis-mcp check
      scan: true
      block_on_scan_failure: true
      # Count tags already published for this upstream version. Failed builds
      # publish no tag, so they do not consume a revision or open a bump PR.
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}
