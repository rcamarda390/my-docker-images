name: Build and publish Docker Socket Proxy image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "images/docker-socket-proxy/**"

# Serialize publications so two dispatches cannot calculate the same next tag.
concurrency:
  group: docker-socket-proxy-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    name: Build and publish Docker Socket Proxy image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: docker-socket-proxy
      context: ./images/docker-socket-proxy
      dockerfile: ./images/docker-socket-proxy/Dockerfile
      config: images/docker-socket-proxy/image.yaml
      version_arg: DOCKER_SOCKET_PROXY_VERSION
      platforms: linux/amd64
      run_smoke_test: false
      smoke_healthcheck: true
      smoke_healthcheck_port: 2375
      smoke_healthcheck_path: /version
      smoke_volumes: >-
        -v /var/run/docker.sock:/var/run/docker.sock:ro
      scan: true
      block_on_scan_failure: true
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}
