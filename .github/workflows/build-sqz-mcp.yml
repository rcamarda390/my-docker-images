name: Build and publish sqz MCP image

on:
  workflow_dispatch:

concurrency:
  group: sqz-mcp-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    name: Build and publish sqz MCP image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: sqz-mcp
      context: ./images/sqz-mcp
      dockerfile: ./images/sqz-mcp/Dockerfile
      config: images/sqz-mcp/image.yaml
      version_arg: SQZ_VERSION
      platforms: linux/amd64
      smoke_command: --help
      scan: true
      # Choose the next revision from successfully published Docker Hub tags.
      # Failed builds consume no revision and existing tags are never reused.
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}
