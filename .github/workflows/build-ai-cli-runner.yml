name: Build and publish AI CLI runner image

on:
  workflow_dispatch:

# Serialize publications so two dispatches cannot calculate the same next tag.
concurrency:
  group: ai-cli-runner-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  airgap-files:
    name: Export air-gap and Xray scan files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package pinned CLI payloads and verify checksums
        run: bash images/ai-cli-runner/build-airgap.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ai-cli-runner-airgap-xray
          path: images/ai-cli-runner/dist/
          if-no-files-found: error
  build:
    name: Build and publish AI CLI runner image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: ai-cli-runner
      context: ./images/ai-cli-runner
      dockerfile: ./images/ai-cli-runner/Dockerfile
      config: images/ai-cli-runner/image.yaml
      # upstream_version is a composite string (claude+cline); the Dockerfile
      # takes the individual versions from build_args and only labels this one.
      version_arg: IMAGE_VERSION
      platforms: linux/amd64
      smoke_entrypoint: sh
      smoke_command: -c,claude --version && cline --version && git --version
      smoke_network_disabled: true
      smoke_timeout: 60
      scan: true
      block_on_scan_failure: true
      revision_from_published_tag_count: true
      publish: ${{ github.event_name != 'pull_request' }}
