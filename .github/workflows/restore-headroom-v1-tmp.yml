name: Restore headroom-mcp 0.42.0-v1 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Point 0.42.0-v1 back at the original baseline digest
        run: |
          set -eux
          src=sha256:afdfcaba8ca347ec0a59670bb52dd2c2b3f3d4803bf4e90d113b103c24f851a1
          docker buildx imagetools create -t ghcr.io/rcamarda390/headroom-mcp:0.42.0-v1 ghcr.io/rcamarda390/headroom-mcp@$src
          docker buildx imagetools create -t docker.io/rcamarda390/headroom-mcp:0.42.0-v1 docker.io/rcamarda390/headroom-mcp@$src
          docker buildx imagetools inspect ghcr.io/rcamarda390/headroom-mcp:0.42.0-v1
          docker buildx imagetools inspect docker.io/rcamarda390/headroom-mcp:0.42.0-v1
