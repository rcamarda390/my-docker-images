name: Build and publish GitHub MCP Server image
run-name: GitHub MCP Server Wolfi — ${{ github.event_name }} — ${{ github.ref_name }}

# Wolfi line for github-mcp-server. Publishes <version>-wolfi-v<revision> using
# the revision in image.wolfi.yaml. No push trigger: a fixed revision must never
# be re-published by an unrelated change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "images/github-mcp-server/Dockerfile.wolfi"
      - "images/github-mcp-server/image.wolfi.yaml"
      - "images/github-mcp-server/runtime-smoke.sh"
      - ".github/workflows/build-github-mcp-server-wolfi.yml"

concurrency:
  group: github-mcp-server-wolfi-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: github-mcp-server
      context: ./images/github-mcp-server
      dockerfile: ./images/github-mcp-server/Dockerfile.wolfi
      config: images/github-mcp-server/image.wolfi.yaml
      version_arg: GITHUB_MCP_VERSION
      # The Dockerfile clones this exact upstream tag commit and verifies it.
      platforms: linux/amd64
      smoke_entrypoint: /bin/sh
      smoke_command: /app/runtime-smoke.sh
      smoke_timeout: 120
      scan: true
      # Trivy findings and scan errors are advisory; build/runtime checks remain blocking.
      block_on_scan_failure: false
      tag_suffix: wolfi
      revision_from_published_tag_count: true
      # Branch dispatches validate the candidate without consuming or publishing
      # an immutable tag. Only a reviewed main-branch dispatch may publish.
      publish: ${{ github.ref == 'refs/heads/main' }}
