# File: .github/workflows/build-slim-docker-vsix.yml
name: Build and publish slim VSIX payload image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - images/slim-docker-vsix/**
      - .github/workflows/build-slim-docker-vsix.yml

# Serialize publications so two dispatches cannot calculate the same next tag.
concurrency:
  group: slim-docker-vsix-publish
  cancel-in-progress: false

permissions:
  # Required by the reusable workflow contract. Published-tag revision mode
  # does not exercise the revision-PR step, but a caller cannot grant less than
  # permissions declared by the called workflow.
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    name: Build and publish slim VSIX payload image
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pull-requests: write
    with:
      image_name: slim-docker-vsix
      context: ./images/slim-docker-vsix
      dockerfile: ./images/slim-docker-vsix/Dockerfile
      config: images/slim-docker-vsix/image.yaml
      version_arg: VSIX_VERSION
      platforms: linux/amd64
      # FROM scratch: checksum, identity and extraction checks run in the builder.
      run_smoke_test: false
      scan: true
      # Count tags already published for this upstream version. Failed builds
      # publish no tag, so they do not consume a revision.
      revision_from_published_tag_count: ${{ github.event_name == 'workflow_dispatch' }}
      publish: ${{ github.event_name != 'pull_request' }}
