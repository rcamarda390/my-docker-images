# software.yaml: edit this list to request a Zeus software change. Keep names and sources clear.
# "version: repo" means the Dockerfile currently accepts the repository version.
# "version: unpinned" means the build can resolve a newer release on the next run.
# The Dockerfile remains the executable build; an agent reviews compatibility,
# updates it and the installation check, then records the tested result.
# image.yaml owns the image release number and pinned Git source commits.

base:
  source: https://catalog.redhat.com/software/containers/ubi10/ubi
  image: registry.access.redhat.com/ubi10/ubi:latest
  python: "3.12"
  python_packages: [python3, python3-pip]
  note: Mutable base tag; review the resulting digest during each build.

os_packages:
  - source: Red Hat UBI 10 repositories
    url: https://catalog.redhat.com/software/containers/ubi10
    packages:
      - {name: python3, version: repo}
      - {name: python3-pip, version: repo}
      - {name: nodejs, version: "22", note: "RHEL 10 AppStream"}
      - {name: npm, version: repo, note: "RHEL 10 AppStream"}
      - {name: shadow-utils, version: repo}
      - {name: findutils, version: repo}
      - {name: file, version: repo}
      - {name: hostname, version: repo}
      - {name: procps-ng, version: repo}
      - {name: git, version: repo}
      - {name: tar, version: repo}
      - {name: htop, version: repo, optional: true}
      - {name: btop, version: repo, optional: true}
      - {name: unzip, version: repo, optional: true}
  - source: PostgreSQL PGDG EL10 repository
    url: https://www.postgresql.org/download/linux/redhat/
    packages:
      - {name: postgresql15, version: "15.x", note: "client; repo RPM URL is unpinned"}
  - source: Docker CE RHEL 10 repository
    url: https://download.docker.com/linux/rhel/10/
    packages:
      - {name: docker-ce-cli, version: repo, note: "Buildx/Compose RPM weak dependencies excluded; Docker CLI and docker exec retained"}

python_packages:
  source: https://pypi.org/
  packages:
    # Airflow and its providers must be resolved together against Python 3.12 constraints.
    - {name: apache-airflow, version: "3.3.2", note: "constraints-3.3.2/constraints-3.12.txt"}
    - {name: apache-airflow-providers-common-compat, version: constraints}
    - {name: apache-airflow-providers-common-io, version: constraints}
    - {name: apache-airflow-providers-common-sql, version: constraints}
    - {name: apache-airflow-providers-ftp, version: constraints}
    - {name: apache-airflow-providers-http, version: constraints}
    - {name: apache-airflow-providers-imap, version: constraints}
    - {name: apache-airflow-providers-smtp, version: constraints}
    - {name: apache-airflow-providers-sqlite, version: constraints}
    - {name: apache-airflow-providers-amazon, version: constraints}
    - {name: apache-airflow-providers-ssh, version: constraints}
    - {name: apache-airflow-providers-fab, version: constraints}
    - {name: msgpack, version: "1.2.3", note: "security fix; explicitly upgraded after providers"}
    - {name: urllib3, version: "2.8.0", note: "also pinned in AWS CLI venv and both pip vendor trees"}
    - {name: PyJWT, version: "2.15.1"}
    - {name: Mako, version: "1.4.3"}
    - {name: Werkzeug, version: "3.1.9"}
    - {name: setuptools, version: "84.0.0", note: "security fix; explicitly upgraded after providers"}
    - {name: pip, version: "26.2.1", note: "vendored urllib3 upgraded to 2.8.0 and msgpack to 1.2.3, bundled pkg_resources (setuptools 70.3.0) removed; SBOM and installation record kept consistent"}
    - {name: numpy, version: "2.5.4"}
    - {name: pandas, version: "3.0.6"}
    - {name: psycopg2-binary, version: "2.9.13"}
    - {name: tabulate, version: "0.10.0"}
    - {name: sqlparse, version: "0.6.0"}
    - {name: cryptography, version: "50.0.2"}
    - {name: colorama, version: "0.4.6"}
    - {name: PyYAML, version: "6.0.3"}
    - {name: duckdb, version: "1.5.6"}
    - {name: sqlglot, version: "30.23.0"}
    - {name: s3fs, version: "2026.9.0"}
    - {name: fsspec, version: "2026.9.0", note: "security fix; resolved with s3fs and the installed Airflow providers"}
    - {name: asyncssh, version: "2.24.1", note: "security fix; explicitly upgraded after providers"}
    - {name: multidict, version: "6.9.1", note: "security fix; explicitly upgraded after providers"}
    - {name: aiobotocore, version: "3.9.2", note: "resolved together with S3FS and boto3/botocore 1.43.106; requires botocore >=1.43.101,<1.43.107"}
    - {name: jira, version: "3.10.5"}
    - {name: beautifulsoup4, version: "4.15.0"}
    - {name: html2text, version: "2025.4.15"}
    - {name: markdown-it-py, version: "4.2.0"}
    - {name: sqlfluff, version: "4.4.0"}
    - {name: botocore, version: "1.43.106"}
    - {name: boto3, version: "1.43.106"}
    - {name: awscli, version: "1.46.1", note: "CLI v1; isolated in /opt/aws-cli with pip 26.2.1 and urllib3 2.8.0"}
    - {name: ruff, version: "0.17.1", optional: true}
    - {name: pyfiglet, version: unpinned, optional: true}

npm_packages:
  source: https://www.npmjs.com/
  packages:
    - {name: pyright, version: unpinned, optional: true}
    - {name: "@agentmemory/agentmemory", version: "0.9.30"}
    - {name: "@agentmemory/mcp", version: "0.9.30"}
    - {name: cline, version: "3.0.73", note: "CLI in /opt/cline, not VS Code extension"}
    - {name: "@anthropic-ai/claude-code", version: "2.1.303"}
    - {name: "@modelcontextprotocol/sdk", version: "1.32.1", note: "GitLab MCP dependencies only"}
    - {name: axios, version: "1.20.0", note: "GitLab MCP dependencies only"}
    - {name: "@types/node", version: unpinned, note: "GitLab MCP dependencies only"}
    - {name: typescript, version: "6.0.3", note: "GitLab MCP dependencies only; avoids native Go compiler binary"}


source_backports:
  - name: node-forge
    version: "1.4.0"
    advisory: CVE-2026-85393
    source: https://github.com/digitalbazaar/forge/pull/1152
    note: Nested DigestAlgorithm validation; malformed/valid signature regressions; upstream package version preserved. Remove carry when an upstream fixed release is installed.

npm_overrides:
  cline:
    root: /opt/cline
    packages:
      - {name: axios, version: "1.20.0"}
      - {name: simple-git, version: "4.0.1"}
      - {name: "@simple-git/argv-parser", version: "2.0.1"}
      - {name: "@modelcontextprotocol/sdk", version: "1.32.1"}
      - {name: "@hono/node-server", version: "2.1.3"}
      - {name: "@ai-sdk/provider-utils@3", version: "3.0.41"}
      - {name: "@ai-sdk/provider-utils@4", version: "4.0.57"}
      - {name: "@ai-sdk/provider-utils@5", version: "5.0.53", note: "version-scoped overrides preserve supported major branches, including nested peers"}
      - {name: "@opentelemetry/core", version: "2.9.0"}
      - {name: undici, version: "6.28.1", note: "security override for the pinned Cline CLI; simple-git 4 named-import compatibility patch also applied"}
  agentmemory:
    roots: [/opt/agentmemory, /opt/agentmemory-mcp]
    packages:
      - {name: axios, version: "1.20.0"}
      - {name: simple-git, version: "4.0.1"}
      - {name: "@simple-git/argv-parser", version: "2.0.1"}
      - {name: "@modelcontextprotocol/sdk", version: "1.32.1"}
      - {name: "@hono/node-server", version: "2.1.3"}
      - {name: "@ai-sdk/provider-utils@3", version: "3.0.41"}
      - {name: "@ai-sdk/provider-utils@4", version: "4.0.57"}
      - {name: "@ai-sdk/provider-utils@5", version: "5.0.53", note: "version-scoped overrides preserve supported major branches, including nested peers"}
      - {name: iii-sdk, version: "0.22.1", note: "matches AgentMemory 0.9.30 and its compatible engine SDK"}
      - {name: "@opentelemetry/api-logs", version: "0.200.0"}
      - {name: "@opentelemetry/core", version: "2.9.0"}
      - {name: "@opentelemetry/context-async-hooks", version: "2.9.0"}
      - {name: "@opentelemetry/instrumentation", version: "0.200.0"}
      - {name: "@opentelemetry/otlp-transformer", version: "0.200.0"}
      - {name: "@opentelemetry/propagator-b3", version: "2.9.0"}
      - {name: "@opentelemetry/propagator-jaeger", version: "2.9.0"}
      - {name: "@opentelemetry/resources", version: "2.9.0"}
      - {name: "@opentelemetry/sdk-logs", version: "0.200.0"}
      - {name: "@opentelemetry/sdk-metrics", version: "2.9.0"}
      - {name: "@opentelemetry/sdk-trace-base", version: "2.9.0"}
      - {name: "@opentelemetry/sdk-trace-node", version: "2.9.0"}

downloaded_binaries:
  - name: docker-compose
    version: "5.6.0"
    source: https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64
    sha256: 40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a
    note: Official binary with Go 1.26.8 and containerd 2.4.1; replaces older RPM dependency.

source_binaries:
  - name: bifrost-cli
    version: "1.0.0"
    source: https://github.com/maximhq/bifrost/tree/555e0ea5863f8e80f0735967657f889d7b5b8ba0/cli
    commit: 555e0ea5863f8e80f0735967657f889d7b5b8ba0
    toolchain: "Go 1.27.2"
    note: Pinned CLI 1.0.0 release; built with fixed Go toolchain, upstream tests, recorded build info and checksum.

source_builds:
  - name: pcre2
    version: "10.49"
    source: https://github.com/PCRE2Project/pcre2/releases/tag/pcre2-10.49
    sha256: 929f0b20e62879252a15886b06c89f1edef61a363cbd5826fb041080a5e557ae
    note: "UBI10-native pcre2 and pcre2-syntax RPMs; upstream tests, exported ABI comparison and runtime Git/grep/DNF checks. Remove carry when UBI10 supplies equivalent fixes."
  - name: archify
    source: https://github.com/tt-a1i/archify
    version: "3.2.0"
    commit: 208acba8d412335185b2056fedf54b3405df43fb
    note: Git commit is also in image.yaml and Dockerfile.
  - name: xdg-user-dir
    source: https://gitlab.freedesktop.org/xdg/xdg-user-dirs
    version: pinned_commit
    commit: cd05b6d29da1abdb3cd253ef496ae7fd1593e4bb
    note: Only the xdg-user-dir command is copied into the image.

build_only:
  - {name: golang, version: "1.26.8-alpine3.23", source: "https://hub.docker.com/_/golang", note: "Compose binary build-info verification only"}
  - {name: golang, version: "1.27.2-alpine3.24", source: "https://hub.docker.com/_/golang", note: "Bifrost CLI source build; compiler excluded from final image"}
  - {name: alpine, version: "3.23.4", source: "https://hub.docker.com/_/alpine", note: "Archify source stage; digest pinned in Dockerfile"}
  - {name: meson, version: "1.10.0", source: "https://pypi.org/project/meson/", note: "xdg-user-dir build stage"}
  - {name: ninja, version: "1.13.0", source: "https://pypi.org/project/ninja/", note: "xdg-user-dir build stage"}
  - {name: gcc, version: repo, source: "Red Hat UBI 10 repositories", note: "xdg-user-dir build stage"}
  - {name: git, version: repo, source: "Red Hat UBI 10 repositories", note: "xdg-user-dir build stage"}

